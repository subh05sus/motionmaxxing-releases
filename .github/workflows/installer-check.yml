# Checks the Windows installer on a real Windows: both PowerShells parse it, and run against a stand-in site (the code
# check says yes) it brings every pinned tool, sha256-checked, into the layout the app expects, and each one starts.
name: installer check
on:
  workflow_dispatch:
    inputs:
      script:
        description: "install.ps1, base64, made for the site http://127.0.0.1:8080"
        required: true
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: The script
        shell: pwsh
        env:
          SCRIPT: ${{ inputs.script }}
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\install.ps1", [Convert]::FromBase64String($env:SCRIPT))
          Get-FileHash "$env:RUNNER_TEMP\install.ps1"
      - name: Windows PowerShell 5.1 and PowerShell 7 parse it
        shell: pwsh
        run: |
          Set-Content "$env:RUNNER_TEMP\parse.ps1" '$e = $null; [void][System.Management.Automation.Language.Parser]::ParseFile($args[0], [ref]$null, [ref]$e); if ($e) { $e | ForEach-Object { Write-Host "$($_.Extent.StartLineNumber): $($_.Message)" }; exit 1 }; Write-Host "parses in $($PSVersionTable.PSVersion)"'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:RUNNER_TEMP\parse.ps1" "$env:RUNNER_TEMP\install.ps1"
          if ($LASTEXITCODE) { exit 1 }
          pwsh -NoProfile -File "$env:RUNNER_TEMP\parse.ps1" "$env:RUNNER_TEMP\install.ps1"
          if ($LASTEXITCODE) { exit 1 }
      - name: A stand-in site
        shell: pwsh
        run: |
          $js = @'
          require("http").createServer((q, s) => {
            console.log(q.method, q.url);
            if (q.url === "/api/v1/install-check") { s.writeHead(200, { "content-type": "application/json" }); return s.end('{"ok":true}'); }
            s.writeHead(404); s.end();
          }).listen(8080);
          '@
          Set-Content "$env:RUNNER_TEMP\site.js" $js
          Start-Process node -ArgumentList "$env:RUNNER_TEMP\site.js" -RedirectStandardOutput "$env:RUNNER_TEMP\site.log"
          Start-Sleep 2
      - name: Run it the way the line does (irm | iex), in Windows PowerShell 5.1
        shell: powershell
        run: |
          $out = Get-Content -Raw "$env:RUNNER_TEMP\install.ps1" | Invoke-Expression *>&1 | Out-String
          Write-Host $out
          # without a Windows package on the stand-in it stops at the package, after the tools
          if ($out -notmatch 'It works\.') { throw 'the code check did not pass' }
      - name: The tools are where the app looks, and start
        shell: pwsh
        run: |
          $t = Join-Path $env:LOCALAPPDATA 'motionmaxxing\tools'
          Get-ChildItem $t | Format-Table Name
          & "$t\node\node.exe" -v; if ($LASTEXITCODE) { exit 1 }
          & "$t\node\npm.cmd" -v; if ($LASTEXITCODE) { exit 1 }
          $py = Get-ChildItem "$t\python" -Directory | Where-Object Name -like 'cpython-3.1*' | Select-Object -First 1
          & "$($py.FullName)\python.exe" -c "import sys, venv, ssl, sqlite3; print(sys.version)"; if ($LASTEXITCODE) { exit 1 }
          & "$t\ffmpeg\bin\ffmpeg.exe" -hide_banner -version | Select-Object -First 1; if ($LASTEXITCODE) { exit 1 }
          & "$t\ffmpeg\bin\ffprobe.exe" -hide_banner -version | Select-Object -First 1; if ($LASTEXITCODE) { exit 1 }
          & "$t\git\cmd\git.exe" --version; if ($LASTEXITCODE) { exit 1 }
          foreach ($w in 'whisper', 'whisper-cpu') {
            & "$t\$w\whisper-cli.exe" --help 2>&1 | Select-Object -First 1
            if (-not (Test-Path "$t\$w\whisper-server.exe")) { throw "$w has no whisper-server.exe" }
          }
          Get-ChildItem $t -Filter *.sha256 | ForEach-Object { "$($_.Name) $(Get-Content $_.FullName)" }
          Get-Content "$env:RUNNER_TEMP\site.log"
